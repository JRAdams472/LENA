services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lena-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd!"
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'P@ssw0rd!' -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: LENA.API/Dockerfile
    container_name: lena-api
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db;Database=LENA;User Id=sa;Password=P@ssw0rd!;TrustServerCertificate=True;
      - Cors__AllowedOrigins__0=http://localhost
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: lena-ui
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    container_name: lena-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api

volumes:
  mssql_data:
  caddy_data:
  caddy_config:
