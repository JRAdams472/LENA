name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore LENA.slnx
      - name: Format
        run: dotnet format --verify-no-changes LENA.slnx --no-restore
      - name: Build
        run: dotnet build LENA.slnx --no-restore --configuration Release
      - name: Test
        # Integration tests need a SQL Server instance; run unit tests only in this job.
        run: dotnet test LENA.slnx --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests" --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 865434629089-gg6p223alt8qqtjvgbr5hpqbeh414l4c.apps.googleusercontent.com
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
